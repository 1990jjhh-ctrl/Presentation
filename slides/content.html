<section class="slide">
  <h2>A Content Slide</h2>
  <ul>
    <li>Plain slides need no layout class</li>
    <li class="fragment">Add <code>class="fragment"</code> to reveal items one step at a time</li>
    <li class="fragment">Use <span class="accent">accent</span> and <span class="muted">muted</span> to shift emphasis</li>
  </ul>

  <aside class="notes">
    The second and third bullets appear on the next two key presses.
  </aside>
</section>
