<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge Detection</title>
  <link rel="stylesheet" href="assets/deck.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/book.css">
  <script type="module" src="assets/vendor/page-flip.js"></script>
  <script type="module" src="assets/engine/book-model.js"></script>
  <script type="module" src="assets/engine/core.js"></script>
  <script type="module" src="assets/engine/slides.js"></script>
  <script type="module" src="assets/engine/book.js"></script>
</head>
<body>
  <div class="viewport">
    <!-- Book mode: one line per page, in reading order. The first two and last
         two pages are the stiff covers. Paths are relative to this file. -->
    <main class="deck" data-mode="book">
      <div data-page="pages/cover.html"></div>
      <div data-page="pages/inside-front.html"></div>
      <div data-page="pages/intro.html"></div>
      <div data-page="pages/edges-left.html"></div>
      <div data-page="pages/edges-right.html"></div>
      <div data-page="pages/reading.html"></div>
      <div data-page="pages/inside-back.html"></div>
      <div data-page="pages/back-cover.html"></div>
    </main>

    <!-- Slide mode: replace the book above with this.
    <main class="deck" data-mode="slides">
      <div data-slide="slides/title.html"></div>
      <div data-slide="slides/section.html"></div>
      <div data-slide="slides/content.html"></div>
      <div data-slide="slides/columns.html"></div>
      <div data-slide="slides/quote.html"></div>
      <div data-slide="slides/image.html"></div>
      <div data-slide="slides/end.html"></div>
    </main>
    -->
  </div>
</body>
</html>
